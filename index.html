<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>belousov–zhabotinsky reaction</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <header class="hud" id="controls">
        <div class="sliders">
          <label class="control">
            <abbr title="Reaction rate α">α</abbr>
            <input id="alpha" type="range" min="0.85" max="1.55" step="0.01" value="1.20" />
            <strong id="val-alpha">1.20</strong>
          </label>
          <label class="control">
            <abbr title="Steps per frame">spd</abbr>
            <input id="speed" type="range" min="1" max="8" value="2" />
            <strong id="val-spd">2</strong>
          </label>
        </div>

        <div class="divider"></div>

        <div class="metrics" id="stats" aria-live="polite">
          <span>
            <abbr title="Simulation generation">gen</abbr>
            <strong id="val-gen">0</strong>
          </span>
          <span>
            <abbr title="Active wave concentration (a / b)">a/b</abbr>
            <strong id="val-ab">0.00 / 0.00</strong>
          </span>
        </div>

        <div class="divider"></div>

        <div class="actions" id="actions">
          <button
            class="icon-btn"
            id="toggle-play"
            aria-label="Pause simulation"
            data-state="playing"
          >
            <svg class="icon icon-pause" viewBox="0 0 16 16" fill="none">
              <rect x="4" y="3" width="2.5" height="10" rx="1" fill="currentColor" />
              <rect x="9.5" y="3" width="2.5" height="10" rx="1" fill="currentColor" />
            </svg>
            <svg class="icon icon-play" viewBox="0 0 16 16" fill="none">
              <path
                d="M4.5 3.2C4.5 2.65 5.1 2.32 5.56 2.62L12.7 7.42C13.1 7.7 13.1 8.3 12.7 8.58L5.56 13.38C5.1 13.68 4.5 13.35 4.5 12.8V3.2Z"
                fill="currentColor"
              />
            </svg>
            <span class="tooltip" role="tooltip">Pause <kbd>Space</kbd></span>
          </button>

          <button class="icon-btn" id="pulse" aria-label="Inject concentric wave">
            <svg class="icon icon-default" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="2" fill="currentColor" />
              <circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.3" />
            </svg>
            <svg class="icon icon-done" viewBox="0 0 16 16" fill="none">
              <path
                d="M3.5 8.5L6.5 11.5L12.5 4.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="tooltip" role="tooltip">Drop catalyst <kbd>P</kbd></span>
          </button>

          <button class="icon-btn" id="restart" aria-label="Restart">
            <svg class="icon icon-default" viewBox="0 0 16 16" fill="none">
              <path
                d="M12.5 8A4.5 4.5 0 1 1 11.1 4.7M12.5 2.8V5.3H10"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="icon icon-done" viewBox="0 0 16 16" fill="none">
              <path
                d="M3.5 8.5L6.5 11.5L12.5 4.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="tooltip" role="tooltip">Restart <kbd>R</kbd></span>
          </button>
        </div>
      </header>

      <div class="canvas-frame">
        <canvas id="canvas" width="400" height="300"></canvas>
      </div>
    </main>

    <script src="index.js"></script>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const alphaInput = document.getElementById("alpha");
      const speedInput = document.getElementById("speed");
      const valAlpha = document.getElementById("val-alpha");
      const valSpd = document.getElementById("val-spd");
      const valGen = document.getElementById("val-gen");
      const valAb = document.getElementById("val-ab");
      const togglePlayBtn = document.getElementById("toggle-play");
      const toggleTooltip = togglePlayBtn.querySelector(".tooltip");
      const pulseBtn = document.getElementById("pulse");
      const restartBtn = document.getElementById("restart");

      const imageData = ctx.createImageData(canvas.width, canvas.height);
      let state;
      let raf;
      let isPlaying = true;
      let steps = parseInt(speedInput.value, 10);

      function updateStats() {
        valGen.textContent = state.generation;
        valAb.textContent = `${state.meanA.toFixed(2)} / ${state.meanB.toFixed(2)}`;
      }

      function render() {
        if (isPlaying) {
          for (let i = 0; i < steps; i++) {
            stepBZ(state);
          }
        }

        renderBZ(state, imageData.data);
        ctx.putImageData(imageData, 0, 0);
        updateStats();

        raf = isPlaying ? requestAnimationFrame(render) : null;
      }

      function reset() {
        if (raf) cancelAnimationFrame(raf);
        const alpha = parseFloat(alphaInput.value);
        valAlpha.textContent = alpha.toFixed(2);
        state = createBZ(canvas.width, canvas.height, alpha, 1.0, 1.0);
        render();
      }

      function togglePlay(viaKeyboard = false) {
        isPlaying = !isPlaying;
        if (viaKeyboard) {
          togglePlayBtn.dataset.instant = "true";
          requestAnimationFrame(() => delete togglePlayBtn.dataset.instant);
        }
        togglePlayBtn.dataset.state = isPlaying ? "playing" : "paused";
        togglePlayBtn.setAttribute(
          "aria-label",
          isPlaying ? "Pause simulation" : "Resume simulation",
        );
        toggleTooltip.innerHTML = `${isPlaying ? "Pause" : "Play"} <kbd>Space</kbd>`;
        if (isPlaying && !raf) render();
      }

      function flashConfirmState(btn) {
        clearTimeout(btn._confirmTimer);
        btn.dataset.confirmed = "true";
        btn._confirmTimer = setTimeout(() => delete btn.dataset.confirmed, 650);
      }

      function triggerRandomPulse() {
        const x = (0.15 + Math.random() * 0.7) * canvas.width;
        const y = (0.15 + Math.random() * 0.7) * canvas.height;
        injectWave(state, x, y, 10);
        if (!isPlaying) {
          renderBZ(state, imageData.data);
          ctx.putImageData(imageData, 0, 0);
        }
        flashConfirmState(pulseBtn);
      }

      alphaInput.addEventListener("input", () => {
        const alpha = parseFloat(alphaInput.value);
        valAlpha.textContent = alpha.toFixed(2);
        state.alpha = alpha;
      });

      speedInput.addEventListener("input", () => {
        steps = parseInt(speedInput.value, 10);
        valSpd.textContent = speedInput.value;
      });

      togglePlayBtn.addEventListener("click", () => togglePlay(false));
      pulseBtn.addEventListener("click", triggerRandomPulse);
      restartBtn.addEventListener("click", () => {
        reset();
        flashConfirmState(restartBtn);
      });

      let pointerDown = false;
      function dropAtPointer(e) {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * canvas.width;
        const y = ((e.clientY - rect.top) / rect.height) * canvas.height;
        injectWave(state, x, y, 8);
        if (!isPlaying) {
          renderBZ(state, imageData.data);
          ctx.putImageData(imageData, 0, 0);
        }
      }

      canvas.addEventListener("pointerdown", (e) => {
        pointerDown = true;
        dropAtPointer(e);
      });
      window.addEventListener("pointermove", (e) => {
        if (pointerDown) dropAtPointer(e);
      });
      window.addEventListener("pointerup", () => {
        pointerDown = false;
      });

      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if (e.code === "Space") {
          e.preventDefault();
          togglePlay(true);
        } else if (e.key === "r" || e.key === "R") {
          reset();
          flashConfirmState(restartBtn);
        } else if (e.key === "p" || e.key === "P") {
          triggerRandomPulse();
        }
      });

      const actionsContainer = document.getElementById("actions");
      let tooltipWarmTimer = null;

      actionsContainer.addEventListener("pointerenter", () => clearTimeout(tooltipWarmTimer));
      actionsContainer.querySelectorAll(".icon-btn").forEach((btn) => {
        btn.addEventListener("pointerenter", () => {
          if (actionsContainer.dataset.warm === "true") {
            btn.dataset.instant = "true";
          } else {
            btn._warmTimeout = setTimeout(() => {
              actionsContainer.dataset.warm = "true";
            }, 320);
          }
        });
        btn.addEventListener("pointerleave", () => {
          clearTimeout(btn._warmTimeout);
          delete btn.dataset.instant;
        });
      });
      actionsContainer.addEventListener("pointerleave", () => {
        tooltipWarmTimer = setTimeout(() => delete actionsContainer.dataset.warm, 350);
      });

      reset();
    </script>
  </body>
</html>
